# 小步公网入口：宝塔 Nginx -> ZeroTier -> 内网 App。
server {
    listen 80;
    server_name planner.example.com;
    root /www/wwwroot/planner.example.com;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://planner.example.com$request_uri; }
    access_log off;
    error_log /www/wwwlogs/planner.example.com.error.log warn;
}

server {
    listen 443 ssl;
    http2 on;
    server_name planner.example.com;
    root /www/wwwroot/planner.example.com;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/planner.example.com.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/planner.example.com/*.conf;
    #SSL-START
    #error_page 404/404.html;
    ssl_certificate /www/server/panel/vhost/cert/planner.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/planner.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://planner.example.com$request_uri;
    #SSL-END

    client_max_body_size 128k;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / {
        proxy_pass http://10.147.0.2:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_cache off;
        proxy_redirect off;
    }
    # 私人入口包含访问凭据，不记录完整请求 URL。
    access_log off;
    error_log /www/wwwlogs/planner.example.com.error.log warn;
}
